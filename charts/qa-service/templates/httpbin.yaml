{{- if .Values.httpbin.enabled }}
# ============================ HTTPBIN (ready-made REST service) ===============
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-httpbin
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-httpbin
    {{- include "qa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-httpbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-httpbin
    spec:
      containers:
        - name: httpbin
          image: {{ .Values.httpbin.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-httpbin
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-httpbin
    {{- include "qa.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-httpbin
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
