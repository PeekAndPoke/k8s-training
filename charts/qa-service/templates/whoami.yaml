{{- if .Values.whoami.enabled }}
# ============================ WHOAMI (shows serving pod) ======================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-whoami
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-whoami
    {{- include "qa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-whoami
    spec:
      containers:
        - name: whoami
          image: {{ .Values.whoami.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-whoami
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-whoami
    {{- include "qa.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-whoami
  ports:
    - port: 80
      targetPort: 80
{{- end }}
