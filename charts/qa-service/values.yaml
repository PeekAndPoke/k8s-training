# =============================================================================
# values.yaml — the chart's public "API". Everything environment-specific lives
# here so the templates stay generic. Override with --set or -f values-xxx.yaml.
# =============================================================================

# ---- Our application image (gateway + backend share ONE image, two profiles) ----
app:
  image:
    repository: qa-service
    tag: dev                 # local image imported into k3d; CI will set this to a commit SHA
    pullPolicy: IfNotPresent # use the imported image; don't try to pull from a registry
  # The version string surfaced at /hello. This is what you watch change during a rolling update.
  version: "1.1.0"

# ---- Gateway: public role, sits behind the Ingress ----
gateway:
  replicas: 1
  ingress:
    enabled: true
    className: traefik                    # k3s ships Traefik as the Ingress controller
    host: qa.127.0.0.1.sslip.io           # sslip.io wildcard → resolves to 127.0.0.1, no /etc/hosts

# ---- Backend: internal role, talks to Redis. 2 replicas so you can watch load-balancing ----
backend:
  replicas: 2

# ---- Redis: stateful backing service. Password goes into a Kubernetes Secret. ----
redis:
  enabled: true
  image: redis:7-alpine
  # NOTE: plaintext here is fine for training. In the real world this would come from a
  # Sealed Secret / External Secrets / SOPS — never committed in clear. The template still
  # renders it into a Secret object so you see how env-from-secret works.
  password: "practice-redis-pw"

# ---- httpbin: ready-made REST service the gateway calls (/uuid) ----
httpbin:
  enabled: true
  image: mccutchen/go-httpbin:latest

# ---- whoami: returns the serving pod's hostname; watch it rotate across replicas ----
whoami:
  enabled: true
  image: traefik/whoami:latest
